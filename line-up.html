<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menuOpen: false };
  syncMenu() {
    const root = this.el || document;
    const wide = window.innerWidth >= 760;
    const nav = root.querySelector('[data-menu-wide]');
    const btn = root.querySelector('[data-menu-toggle]');
    const panel = root.querySelector('[data-menu-panel]');
    if (nav) nav.style.display = wide ? 'flex' : 'none';
    if (btn) btn.style.display = wide ? 'none' : 'flex';
    if (panel) panel.style.display = !wide && this.state.menuOpen ? 'block' : 'none';
  }
  componentDidUpdate() { this.syncMenu(); }
  componentDidMount() {
    const root = this.el || document;
    this.syncMenu();
    this._onResize = () => this.syncMenu();
    window.addEventListener('resize', this._onResize);
    const items = [...root.querySelectorAll('[data-reveal]')];
    const show = (el) => { el.style.opacity = '1'; };
    items.forEach((el) => {
      el.style.transition = 'opacity .6s ease';
      const r = el.getBoundingClientRect();
      if (!(r.top < window.innerHeight * 0.94 && r.bottom > 0)) el.style.opacity = '0';
    });
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((es) => es.forEach((e) => {
        if (!e.isIntersecting) return;
        show(e.target);
        io.unobserve(e.target);
      }), { threshold: 0.05, rootMargin: '0px 0px -6% 0px' });
      items.forEach((el) => io.observe(el));
      setTimeout(() => items.forEach(show), 2500);
    }
  }
  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }
  renderVals() {
    const d = Math.max(0, Math.floor((new Date('2026-09-19T12:00:00+02:00') - new Date()) / 86400000));
    return { d, toggleMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen })) };
  }
}
</script>
